apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: dns-vector-wildcard
  namespace: nginx-gateway
spec:
  secretName: dns-vector-wildcard-tls
  privateKey:
    algorithm: RSA
    size: 2048
  duration: 2160h
  renewBefore: 360h
  dnsNames:
    - "*.dns-vector.online"
    - "dns-vector.online"
  issuerRef:
    name: letsencrypt-stage
    kind: ClusterIssuer
    group: cert-manager.io